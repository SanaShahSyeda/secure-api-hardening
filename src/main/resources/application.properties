spring.application.name=secure-api-hardening

# Database - Postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api-observability-and-load-testing}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# hibernate-sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# OAuth2 Resource Server - validates JWTs issued by the local Keycloak container.
# Spring Boot derives the JWK Set URL (the public key endpoint) from this issuer automatically.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/secure-api-hardening